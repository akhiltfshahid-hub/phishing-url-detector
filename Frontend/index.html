<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard - URL Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>
    <div class="bg-orb orb-three"></div>

    <div class="page-shell">
        <div class="container">
            <header class="topbar">
                <div class="brand">PhishGuard</div>
                <div class="live-pill"><span class="live-dot"></span> Live Scan</div>
            </header>

            <div class="hero">
                <div class="hero-copy">
                    <div class="badge">Threat Scanner</div>
                    <h1>Stay ahead of phishing attacks.</h1>
                    <p class="subtitle">
                        Analyze incoming URLs for suspicious patterns, impersonation signals, and malicious intent.
                    </p>
                </div>

                <div class="ring-panel">
                    <div class="score-ring" id="scoreRing">
                        <div class="score-ring-inner">
                            <span id="ringValue">0</span>
                            <small>%</small>
                        </div>
                    </div>
                    <div class="ring-meta">
                        <span class="meta-label">Threat Level</span>
                        <strong id="threatLevel">Safe</strong>
                    </div>
                </div>
            </div>

            <div class="scanner">
                <div class="input-wrap">
                    <input
                        id="urlInput"
                        type="text"
                        placeholder="Paste a URL here..."
                        aria-label="URL to analyze"
                    >
                    <button id="scanButton" onclick="analyzeURL()">
                        <span class="button-label">Analyze URL</span>
                        <span class="button-loader" aria-hidden="true"></span>
                    </button>
                </div>
            </div>

            <div class="quick-actions">
                <button class="secondary" type="button" onclick="document.getElementById('urlInput').value='paypal-security-login.com'; analyzeURL();">
                    Try Sample
                </button>
            </div>

            <div id="result" class="result hidden">
                <div class="result-header">
                    <span id="riskBadge" class="risk-badge">Status</span>
                    <span id="score" class="score">Score: 0/100</span>
                </div>

                <h2 id="risk" class="risk-label">Awaiting analysis</h2>

                <div class="reasons-box">
                    <h3>Why this result?</h3>
                    <ul id="reasons"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
